[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-robot-cli"
version = "0.1.0"
description = "Persistent MuJoCo Archer Y6 service and one-shot request CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mujoco>=3.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "pydantic>=2",
  "pyyaml>=6",
  "uvicorn>=0.30",
  "hex_util_robot>=0.0.1a8,<0.1",
  "hex_util_runtime>=0.0.1a15,<0.1",
  "hex_util_urdf>=0.0.1a2,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mujoco_server = "mujoco_robot_cli.server:main"
mujoco_cli = "mujoco_robot_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mujoco_robot_cli = ["assets/archer_y6/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
